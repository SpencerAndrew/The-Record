<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE RECORD | Investigative Portfolio</title>
    <!-- React and ReactDOM CDNs -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX transformation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700;900&family=Playfair+Display:ital,wght@0,700;1,700&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
        }
        
        .font-serif {
            font-family: 'Playfair+Display', serif;
        }

        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f1f1; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #ccc; border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #E63946; }
        
        html { scroll-behavior: smooth; }

        @keyframes marquee {
          0% { transform: translateX(0); }
          100% { transform: translateX(-50%); }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- ICON WRAPPER FOR HTML VERSION ---
        // Robust Icon component to handle Lucide icon definitions from the global window.lucide object
        const Icon = ({ name, size = 20, className = "", strokeWidth = 2 }) => {
            const [svg, setSvg] = useState('');
            
            useEffect(() => {
                if (window.lucide && window.lucide.icons) {
                    const iconDef = window.lucide.icons[name];
                    if (iconDef && Array.isArray(iconDef)) {
                        // iconDef is an array of segments: [['tag', {attrs}], ...]
                        const content = iconDef.map(segment => {
                            if (!Array.isArray(segment)) return '';
                            const [tag, attrs] = segment;
                            const attrString = Object.entries(attrs || {})
                                .filter(([key]) => key !== 'key') // Lucide uses internal keys we don't need for raw SVG
                                .map(([k, v]) => `${k}="${v}"`)
                                .join(' ');
                            return `<${tag} ${attrString}></${tag}>`;
                        }).join('');
                        
                        const svgString = `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${strokeWidth}" stroke-linecap="round" stroke-linejoin="round" class="${className}">${content}</svg>`;
                        setSvg(svgString);
                    }
                }
            }, [name, size, className, strokeWidth]);

            return <span className="inline-flex items-center justify-center" dangerouslySetInnerHTML={{ __html: svg }} />;
        };

        // --- GEMINI API CONFIGURATION ---
        const apiKey = ""; 

        const fetchGemini = async (prompt, systemInstruction = "", useSearch = false) => {
          const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;
          
          const payload = {
            contents: [{ parts: [{ text: prompt }] }],
            systemInstruction: systemInstruction ? { parts: [{ text: systemInstruction }] } : undefined,
            tools: useSearch ? [{ google_search: {} }] : undefined,
          };

          const maxRetries = 5;
          let delay = 1000;

          for (let i = 0; i < maxRetries; i++) {
            try {
              const response = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
              });
              if (!response.ok) throw new Error('API Error');
              const data = await response.json();
              return {
                text: data.candidates?.[0]?.content?.parts?.[0]?.text || "No response received.",
                sources: data.candidates?.[0]?.groundingMetadata?.groundingAttributions?.map(a => ({ 
                  uri: a.web?.uri, 
                  title: a.web?.title 
                })) || []
              };
            } catch (error) {
              if (i === maxRetries - 1) throw error;
              await new Promise(res => setTimeout(res, delay));
              delay *= 2;
            }
          }
        };

        // --- MOCK DATA ---
        const VIDEOS = [
          {
            id: 'v1',
            title: 'The Hidden Cost of Urban Sprawl',
            description: 'Investigating how modern infrastructure choices are bankrupting suburban communities and what we can do to fix it.',
            category: 'Infrastructure',
            thumbnail: 'https://images.unsplash.com/photo-1449824913935-59a10b8d2000?auto=format&fit=crop&q=80&w=800',
            views: '1.2M',
            duration: '18:24',
            date: 'May 3, 2026',
            featured: true,
            transcript: [
              { time: "0:00", text: "We often think of the suburbs as the American Dream, but for city treasurers, they are starting to look like a nightmare." },
              { time: "1:24", text: "The problem lies in the infrastructure-to-tax-revenue ratio. A single mile of suburban road serves far fewer tax-paying units than a city block." },
              { time: "4:45", text: "When that road needs to be repaved in 25 years, the property taxes collected from those houses don't even cover 20% of the cost." },
              { time: "12:10", text: "We visited Lafayette, Indiana, to see how they are trying to reverse decades of sprawl-based planning." }
            ],
            researchNotes: `
# INVESTIGATION NOTES: URBAN SPRAWL
## Summary
A 12-month study into the fiscal sustainability of low-density residential development.

## Key Findings
1. **The Infrastructure Gap:** Every $1.00 of residential tax revenue from low-density areas requires $1.40 in infrastructure maintenance costs.
2. **Density Paradox:** High-density downtown cores subsidize the infrastructure of the surrounding suburbs in 84% of the cities analyzed.
3. **Public Debt:** Municipal bond debt for road repairs has increased by 300% since 1995 in sprawl-heavy regions.

## Data Sources
- Municipal Budget Reports (2010-2025)
- GIS Mapping Data for Lafayette, IN
- Economic Impact Studies by Strong Towns
            `
          }
        ];

        const CATEGORIES = ['All', 'Infrastructure'];

        // --- COMPONENTS ---

        const EvidenceHub = ({ video, activeTab, onClose, theme }) => {
          if (!video) return null;
          return (
            <div className="fixed inset-0 z-[200] flex items-center justify-center p-4 sm:p-12">
              <div className="absolute inset-0 bg-black/80 backdrop-blur-sm" onClick={onClose} />
              <div className={`relative w-full max-w-5xl h-[80vh] flex flex-col rounded-3xl overflow-hidden shadow-2xl ${theme === 'light' ? 'bg-white' : 'bg-[#0F172A]'}`}>
                <div className={`p-6 border-b flex justify-between items-center ${theme === 'light' ? 'bg-gray-50 border-gray-100' : 'bg-[#1E293B] border-gray-800'}`}>
                  <div>
                    <h3 className={`text-lg font-black uppercase tracking-tight ${theme === 'light' ? 'text-[#0A192F]' : 'text-white'}`}>Evidence Hub: {video.title}</h3>
                    <p className="text-xs text-gray-400 font-bold uppercase tracking-widest mt-1">Primary Investigative Data</p>
                  </div>
                  <button onClick={onClose} className="p-2 hover:bg-gray-200 rounded-full transition-colors focus:outline-none"><Icon name="X" size={24} className={theme === 'light' ? 'text-gray-900' : 'text-white'} /></button>
                </div>
                <div className="flex-1 flex overflow-hidden">
                  <div className={`w-16 sm:w-24 border-r flex flex-col items-center py-8 gap-8 ${theme === 'light' ? 'bg-gray-50 border-gray-100' : 'bg-[#0F172A] border-gray-800'}`}>
                    <button onClick={() => window.dispatchEvent(new CustomEvent('changeTab', { detail: 'transcript' }))} className={`flex flex-col items-center gap-1 transition-colors ${activeTab === 'transcript' ? 'text-red-600' : 'text-gray-400 hover:text-gray-600'}`}>
                      <Icon name="Mic" size={24} /><span className="text-[8px] font-bold uppercase">Transcript</span>
                    </button>
                    <button onClick={() => window.dispatchEvent(new CustomEvent('changeTab', { detail: 'notes' }))} className={`flex flex-col items-center gap-1 transition-colors ${activeTab === 'notes' ? 'text-red-600' : 'text-gray-400 hover:text-gray-600'}`}>
                      <Icon name="ClipboardList" size={24} /><span className="text-[8px] font-bold uppercase">Research</span>
                    </button>
                  </div>
                  <div className="flex-1 overflow-y-auto p-8 custom-scrollbar">
                    {activeTab === 'transcript' ? (
                      <div className="space-y-8 max-w-3xl">
                        {video.transcript.map((item, idx) => (
                          <div key={idx} className="flex gap-6"><span className="text-xs font-mono font-bold text-red-600 bg-red-50 px-2 py-1 rounded h-fit shrink-0">{item.time}</span>
                          <p className={`text-base leading-relaxed ${theme === 'light' ? 'text-gray-700' : 'text-gray-300'}`}>{item.text}</p></div>
                        ))}
                      </div>
                    ) : (
                      <div className={`whitespace-pre-wrap font-serif leading-relaxed text-lg ${theme === 'light' ? 'text-gray-800' : 'text-gray-200'}`}>
                        {video.researchNotes}
                      </div>
                    )}
                  </div>
                </div>
              </div>
            </div>
          );
        };

        const AIResearchAssistant = ({ theme }) => {
          const [isOpen, setIsOpen] = useState(false);
          const [query, setQuery] = useState('');
          const [messages, setMessages] = useState([{ role: 'ai', text: "Hello! Ask me anything about urban planning." }]);
          const [isTyping, setIsTyping] = useState(false);
          const scrollRef = useRef(null);

          const handleAsk = async (e) => {
            e.preventDefault();
            if (!query.trim()) return;
            setMessages(prev => [...prev, { role: 'user', text: query }]);
            setQuery('');
            setIsTyping(true);
            try {
              const result = await fetchGemini(query, "Expert urban assistant.", true);
              setMessages(prev => [...prev, { role: 'ai', text: result.text, sources: result.sources }]);
            } catch (err) {
              setMessages(prev => [...prev, { role: 'ai', text: "Error connecting." }]);
            } finally { setIsTyping(false); }
          };

          return (
            <div className="fixed bottom-24 right-6 z-[110]">
              {isOpen ? (
                <div className={`w-80 sm:w-96 h-[500px] rounded-2xl shadow-2xl border flex flex-col overflow-hidden ${theme === 'light' ? 'bg-white' : 'bg-[#0F172A] border-gray-800'}`}>
                  <div className="bg-[#0A192F] p-4 text-white flex justify-between items-center">
                    <span className="font-bold text-sm uppercase tracking-wider flex items-center gap-2"><Icon name="Sparkles" size={16} /> Research Desk ✨</span>
                    <button onClick={() => setIsOpen(false)}><Icon name="X" size={20} /></button>
                  </div>
                  <div ref={scrollRef} className={`flex-1 overflow-y-auto p-4 space-y-4 ${theme === 'light' ? 'bg-gray-50' : 'bg-[#1E293B]'}`}>
                    {messages.map((m, i) => (
                      <div key={i} className={`flex ${m.role === 'user' ? 'justify-end' : 'justify-start'}`}>
                        <div className={`max-w-[85%] p-3 rounded-2xl text-sm ${m.role === 'user' ? 'bg-[#E63946] text-white' : theme === 'light' ? 'bg-white shadow-sm' : 'bg-[#0F172A] border border-gray-700'}`}>
                          <p>{m.text}</p>
                        </div>
                      </div>
                    ))}
                  </div>
                  <form onSubmit={handleAsk} className="p-4 flex gap-2"><input value={query} onChange={e => setQuery(e.target.value)} placeholder="Ask..." className="flex-1 bg-gray-100 rounded-full px-4 py-2 text-sm text-black" /><button className="bg-[#0A192F] text-white p-2 rounded-full"><Icon name="Send" size={18} /></button></form>
                </div>
              ) : (
                <button onClick={() => setIsOpen(true)} className="bg-[#0A192F] text-white p-4 rounded-full shadow-2xl flex items-center gap-3 hover:scale-105 transition-transform"><Icon name="Sparkles" /><span className="font-bold text-sm">Ask AI ✨</span></button>
              )}
            </div>
          );
        };

        const DeepDiveButton = ({ video, theme, onOpenEvidence }) => {
          const [loading, setLoading] = useState(false);
          const [analysis, setAnalysis] = useState(null);
          const getAnalysis = async () => {
            setLoading(true);
            try {
              const result = await fetchGemini(`Analyze investigative angle for: ${video.title}. Summary: ${video.description}`, "Investigative producer.");
              setAnalysis(result.text);
            } catch (e) { setAnalysis("Error generating content."); } finally { setLoading(false); }
          };
          return (
            <div className="mt-6 border-t pt-6">
              <div className="flex gap-6 mb-6">
                <button onClick={() => onOpenEvidence('transcript')} className="text-[10px] font-black uppercase text-gray-500 hover:text-red-600 flex items-center gap-2 transition-colors"><Icon name="Mic" size={14} /> Transcript</button>
                <button onClick={() => onOpenEvidence('notes')} className="text-[10px] font-black uppercase text-gray-500 hover:text-red-600 flex items-center gap-2 transition-colors"><Icon name="ClipboardList" size={14} /> Notes</button>
              </div>
              {!analysis && !loading && (
                <button onClick={getAnalysis} className="flex items-center gap-2 text-xs font-black uppercase text-[#0A192F] dark:text-gray-300 hover:text-red-600 dark:hover:text-red-400 transition-colors"><Icon name="Sparkles" /> Generate ✨ AI Analysis</button>
              )}
              {loading && <div className="text-xs font-bold animate-pulse text-red-500">Generating Analysis...</div>}
              {analysis && <div className={`p-4 rounded-xl mt-4 text-sm leading-relaxed whitespace-pre-wrap border ${theme === 'light' ? 'bg-gray-50 border-gray-100 text-gray-700' : 'bg-[#1E293B] border-gray-700 text-gray-200'}`}>{analysis}</div>}
            </div>
          );
        };

        const BackToTop = ({ concept }) => {
          const [visible, setVisible] = useState(false);
          useEffect(() => {
            const toggle = () => window.pageYOffset > 400 ? setVisible(true) : setVisible(false);
            window.addEventListener('scroll', toggle);
            return () => window.removeEventListener('scroll', toggle);
          }, []);
          if (!visible) return null;
          return (
            <button onClick={() => window.scrollTo({ top: 0, behavior: 'smooth' })} className={`fixed bottom-[220px] right-6 z-[105] p-3 rounded-full shadow-2xl transition-all hover:scale-110 active:scale-95 ${concept === 'frontpage' ? 'bg-[#E63946] text-white' : 'bg-white text-green-800'}`}>
              <Icon name="ChevronUp" strokeWidth={3} />
            </button>
          );
        };

        const USLiveClocks = () => {
          const [time, setTime] = useState(new Date());
          useEffect(() => {
            const t = setInterval(() => setTime(new Date()), 1000);
            return () => clearInterval(t);
          }, []);
          const zones = [
            { label: 'HST', zone: 'Pacific/Honolulu' }, { label: 'AKT', zone: 'America/Anchorage' },
            { label: 'PT', zone: 'America/Los_Angeles' }, { label: 'MT', zone: 'America/Denver' },
            { label: 'CT', zone: 'America/Chicago' }, { label: 'ET', zone: 'America/New_York' },
          ];
          return (
            <div className="bg-[#0A192F] text-white py-2 px-6 flex justify-center flex-wrap gap-6 text-[10px] font-black uppercase border-b border-white/10">
              {zones.map(z => (
                <div key={z.label} className="flex gap-2">
                  <span className="opacity-50">{z.label}</span>
                  <span className="font-mono">{time.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true, timeZone: z.zone })}</span>
                </div>
              ))}
            </div>
          );
        };

        const VideoCard = ({ video, theme }) => (
          <div className={`border group cursor-pointer flex flex-col transition-all hover:shadow-lg ${theme === 'light' ? 'bg-white border-gray-100 shadow-sm' : 'bg-[#0F172A] border-gray-800'}`}>
            <div className="aspect-video relative overflow-hidden">
              <img src={video.thumbnail} className="w-full h-full object-cover transition-transform group-hover:scale-105" />
              <div className="absolute bottom-2 right-2 bg-black/80 text-white text-[10px] px-1.5 py-0.5">{video.duration}</div>
              <div className="absolute inset-0 bg-black/20 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center">
                 <Icon name="Play" size={32} className="text-white fill-current opacity-80" />
              </div>
            </div>
            <div className="p-4 flex-1">
              <h3 className={`font-bold mb-2 uppercase transition-colors group-hover:text-red-600 ${theme === 'light' ? 'text-gray-900' : 'text-white'}`}>{video.title}</h3>
              <p className="text-sm opacity-60 line-clamp-2">{video.description}</p>
            </div>
          </div>
        );

        const ConceptFrontPage = ({ videos, theme, onOpenEvidence }) => {
          const featured = videos[0];
          return (
            <div className={`min-h-screen ${theme === 'light' ? 'bg-white text-[#0A192F]' : 'bg-[#050b14] text-gray-100'}`}>
              <USLiveClocks />
              <header className="py-12 text-center border-b-4 border-[#0A192F] dark:border-red-600">
                <h1 className="text-6xl font-black italic uppercase tracking-tighter">THE RECORD</h1>
                <p className="text-xs font-bold uppercase tracking-[0.3em] opacity-60 mt-2">Insight • Impact • Investigation</p>
              </header>
              <main className="max-w-7xl mx-auto px-6 py-12">
                <div className="grid lg:grid-cols-2 gap-12 items-start mb-16">
                  <div className="aspect-video bg-black relative rounded shadow-2xl overflow-hidden group cursor-pointer">
                    <img src={featured.thumbnail} className="w-full h-full object-cover opacity-80 group-hover:scale-105 transition-transform duration-700" />
                    <div className="absolute inset-0 flex items-center justify-center"><div className="bg-red-600 p-6 rounded-full group-hover:scale-110 transition-transform"><Icon name="Play" size={32} /></div></div>
                  </div>
                  <div className="lg:pl-6">
                    <div className="text-red-600 font-black uppercase text-[10px] tracking-[0.2em] mb-2">Featured Investigation</div>
                    <h2 className="text-5xl font-black uppercase tracking-tighter leading-tight mb-4">{featured.title}</h2>
                    <p className="text-lg opacity-80 mb-6 leading-relaxed">{featured.description}</p>
                    <DeepDiveButton video={featured} theme={theme} onOpenEvidence={onOpenEvidence} />
                  </div>
                </div>
                <div className="grid md:grid-cols-3 gap-8">
                  {videos.map(v => <VideoCard key={v.id} video={v} theme={theme} />)}
                </div>
              </main>
            </div>
          );
        };

        const ConceptImmersive = ({ videos, onOpenEvidence }) => (
          <div className="bg-[#F8F9FA] text-[#1B4332]">
            <header className="fixed top-0 w-full z-50 p-8 text-2xl font-serif italic mix-blend-difference text-white">The Storyteller</header>
            <main>
              {videos.map((v, i) => (
                <section key={v.id} className="min-h-screen flex items-center justify-center sticky top-0" style={{ backgroundColor: i % 2 === 0 ? '#1B4332' : '#D9480F', color: '#F8F9FA' }}>
                  <div className="max-w-6xl w-full px-12 grid lg:grid-cols-2 gap-16 items-center">
                    <div>
                      <div className="text-[10px] font-bold uppercase tracking-[0.4em] opacity-60 mb-2">Chapter 0{i + 1}</div>
                      <h2 className="text-6xl font-serif italic mb-6">{v.title}</h2>
                      <p className="text-lg opacity-90 mb-8 leading-relaxed max-w-md">{v.description}</p>
                      <div className="flex gap-4">
                        <button className="px-8 py-4 rounded-full border border-white hover:bg-white hover:text-black transition-all font-bold">Start Reading</button>
                        <button onClick={() => onOpenEvidence('transcript')} className="p-4 rounded-full border border-white/30 hover:border-white transition-all"><Icon name="ClipboardList" /></button>
                      </div>
                    </div>
                    <div className="rounded-2xl shadow-2xl overflow-hidden aspect-square"><img src={v.thumbnail} className="w-full h-full object-cover transition-transform duration-1000" /></div>
                  </div>
                </section>
              ))}
            </main>
          </div>
        );

        function App() {
          const [concept, setConcept] = useState('frontpage');
          const [theme, setTheme] = useState('light');
          const [evidenceTarget, setEvidenceTarget] = useState(null);
          const [evidenceTab, setEvidenceTab] = useState('transcript');

          useEffect(() => {
            const handleTab = e => setEvidenceTab(e.detail);
            window.addEventListener('changeTab', handleTab);
            return () => window.removeEventListener('changeTab', handleTab);
          }, []);

          return (
            <div className="relative">
              <div className="fixed bottom-6 left-6 z-[100] flex gap-2 p-2 bg-white/90 backdrop-blur shadow-2xl rounded-2xl border border-gray-100 items-center">
                <button onClick={() => setConcept('frontpage')} className={`p-3 rounded-xl flex flex-col items-center gap-1 transition-all ${concept === 'frontpage' ? 'bg-[#E63946] text-white scale-110' : 'text-gray-400 hover:bg-gray-50'}`}>
                  <Icon name="Newspaper" /><span className="text-[8px] font-bold uppercase">Front Page</span>
                </button>
                <button onClick={() => setConcept('immersive')} className={`p-3 rounded-xl flex flex-col items-center gap-1 transition-all ${concept === 'immersive' ? 'bg-[#1B4332] text-white scale-110' : 'text-gray-400 hover:bg-gray-50'}`}>
                  <Icon name="BookOpen" /><span className="text-[8px] font-bold uppercase">Storyteller</span>
                </button>
                <div className="w-px h-8 bg-gray-200 mx-1" />
                <button onClick={() => setTheme(t => t === 'light' ? 'dark' : 'light')} className="p-3 hover:bg-gray-50 rounded-xl transition-all">
                  {theme === 'light' ? <Icon name="Moon" /> : <Icon name="Sun" />}
                </button>
              </div>

              <BackToTop concept={concept} />
              <AIResearchAssistant theme={theme} />
              {evidenceTarget && <EvidenceHub video={evidenceTarget} activeTab={evidenceTab} onClose={() => setEvidenceTarget(null)} theme={theme} />}

              {concept === 'frontpage' ? 
                <ConceptFrontPage videos={VIDEOS} theme={theme} onOpenEvidence={type => { setEvidenceTarget(VIDEOS[0]); setEvidenceTab(type); }} /> : 
                <ConceptImmersive videos={VIDEOS} onOpenEvidence={type => { setEvidenceTarget(VIDEOS[0]); setEvidenceTab(type); }} />
              }
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
