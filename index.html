            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;
            const payload = { contents: [{ parts: [{ text: prompt }] }] };
            try {
                const response = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
                const data = await response.json();
                return data.candidates?.[0]?.content?.parts?.[0]?.text || "No response received.";
            } catch (err) { return "Connection Error."; }
        };

                    const iconDef = window.lucide.icons[name];
                    const content = iconDef.map(seg => {
                        const [tag, attrs] = seg;
                        const attrStr = Object.entries(attrs).map(([k, v]) => `${k}="${v}"`).join(' ');
                        return `<${tag} ${attrStr}></${tag}>`;
                    }).join('');
                    setSvg(`<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${strokeWidth}" stroke-linecap="round" stroke-linejoin="round" class="${className}">${content}</svg>`);

            }, [name, size, className]);

                            <div className="bg-[#0A192F] p-4 text-white flex justify-between items-center">
                                <span className="font-bold text-sm uppercase tracking-wider flex items-center gap-2">Research Desk</span>
                                <button onClick={() => setIsOpen(false)}><Icon name="X" /></button>
                            </div>
                            <div className={`flex-1 overflow-y-auto p-4 space-y-4 custom-scrollbar ${theme === 'light' ? 'bg-gray-50' : 'bg-[#1E293B]'}`}>
                                {messages.map((m, i) => (
                                    <div key={i} className={`flex ${m.role === 'user' ? 'justify-end' : 'justify-start'}`}>
                                        <div className={`max-w-[85%] p-3 rounded-2xl text-sm ${m.role === 'user' ? 'bg-[#E63946] text-white' : theme === 'light' ? 'bg-white shadow-sm' : 'bg-[#0F172A] border border-gray-700 text-white'}`}>
                                            <p className="whitespace-pre-wrap leading-relaxed">{m.text}</p>
                                        </div>
                                    </div>
                                ))}
                            </div>
                            <form onSubmit={handleAsk} className={`p-4 border-t flex gap-2 ${theme === 'light' ? 'bg-white' : 'bg-[#0F172A]'}`}>
                                <input value={query} onChange={e => setQuery(e.target.value)} placeholder="Cross-reference topics..." className="flex-1 bg-gray-100 rounded-full px-4 py-2 text-sm text-black" />
                                <button type="submit" className="bg-[#0A192F] text-white p-2 rounded-full"><Icon name="Send" size={18} /></button>
                            </form>
                        </div>
                    ) : (
                        <button onClick={() => setIsOpen(true)} className="bg-[#0A192F] text-white p-4 rounded-full shadow-2xl flex items-center gap-3"><Icon name="Sparkles" /><span className="font-bold text-sm">Analyze ✨</span></button>
                    )}
                </div>
            );
        };

        function App() {
            const [concept, setConcept] = useState('grid');
            const [theme, setTheme] = useState('light');
            const [playingVideo, setPlayingVideo] = useState(null);

            const gridClass = `min-h-screen transition-colors duration-500 ${theme === 'light' ? 'bg-white text-[#0A192F]' : 'bg-[#050b14] text-gray-100'}`;

            return (
                <div className="relative antialiased">
                    <div className="fixed bottom-6 left-6 z-[200] flex gap-2 p-2 bg-white/90 dark:bg-[#0A192F]/90 backdrop-blur shadow-2xl rounded-2xl border border-white/10 items-center">
                        <button onClick={() => setConcept('grid')} className={`p-3 rounded-xl flex flex-col items-center gap-1 ${concept === 'grid' ? 'bg-red-600 text-white' : 'text-gray-400 hover:bg-gray-100'}`}><Icon name="LayoutGrid" /><span className="text-[8px] font-bold uppercase">Grid</span></button>
                        <button onClick={() => setConcept('list')} className={`p-3 rounded-xl flex flex-col items-center gap-1 ${concept === 'list' ? 'bg-blue-600 text-white' : 'text-gray-400 hover:bg-gray-100'}`}><Icon name="List" /><span className="text-[8px] font-bold uppercase">List</span></button>
                        <div className="w-px h-8 bg-gray-500/20 mx-2" />
                        <button onClick={() => setTheme(t => t === 'light' ? 'dark' : 'light')} className="p-3 bg-gray-100 rounded-xl">
                            {theme === 'light' ? <Icon name="Moon" className="text-[#0A192F]" /> : <Icon name="Sun" className="text-yellow-400" />}
                        </button>
                    </div>

                    <button onClick={() => window.scrollTo({top:0, behavior:'smooth'})} className="fixed bottom-[220px] right-6 p-4 bg-red-600 text-white rounded-full z-[105] shadow-xl hover:scale-110 transition-transform"><Icon name="ChevronUp" size={24} /></button>

                    <VideoModal video={playingVideo} onClose={() => setPlayingVideo(null)} />
                    <AIAssistant theme={theme} />

                    {concept === 'grid' ? (
                        <div className={gridClass}>
                            <USLiveClocks />
                            <header className={`py-12 px-6 text-center border-b-4 ${theme === 'light' ? 'border-[#0A192F]' : 'border-red-600'}`}>
                                <h1 className="text-7xl font-black italic uppercase tracking-tighter">THE RECORD</h1>
                                <p className="text-xs font-bold uppercase tracking-[0.5em] opacity-40 mt-2">INVESTIGATIVE ARCHIVE</p>
                            </header>

                            <main className="max-w-7xl mx-auto px-6 py-12 space-y-24">
                                <section>
                                    <h2 className="text-3xl font-black uppercase tracking-tighter mb-12 flex items-center gap-4">
                                        <Icon name="Youtube" className="text-red-600" /> Video Reports
                                    </h2>
                                    <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-8">
                                        {VIDEOS.map(v => (
                                            <div key={v.id} className={`group border cursor-pointer rounded-xl overflow-hidden transition-all duration-500 hover:scale-[1.02] ${theme === 'light' ? 'bg-white border-gray-100 shadow-sm' : 'bg-[#0F172A] border-gray-800'}`} onClick={() => setPlayingVideo(v)}>
                                                <div className="relative aspect-video overflow-hidden">
                                                    <img src={`https://img.youtube.com/vi/${v.youtubeId}/mqdefault.jpg`} className="w-full h-full object-cover group-hover:scale-110 transition-transform duration-700" />
                                                    <div className="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center"><Icon name="Play" size={48} className="text-white" /></div>
                                                </div>
                                                <div className="p-5">
                                                    <div className="text-[10px] font-bold uppercase tracking-widest text-red-500 mb-2">Report</div>
                                                    <h3 className={`font-bold uppercase leading-tight group-hover:text-red-500 transition-colors ${theme === 'light' ? 'text-black' : 'text-white'}`}>{v.title}</h3>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </section>

                                <section>
                                    <h2 className="text-3xl font-black uppercase tracking-tighter mb-12 flex items-center gap-4">
                                        <Icon name="BookOpen" className="text-blue-600" /> Required Reading
                                    </h2>
                                    <div className="grid sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
                                        {ARTICLES.map(a => (
                                            <a key={a.id} href={a.url} target="_blank" className={`p-6 border rounded-xl group transition-all hover:border-blue-500 flex flex-col ${theme === 'light' ? 'bg-white border-gray-100 shadow-sm' : 'bg-[#0F172A] border-gray-800'}`}>
                                                <div className="text-[10px] font-bold uppercase tracking-widest text-blue-500 mb-3">{a.source}</div>
                                                <h3 className={`font-bold uppercase text-sm leading-tight mb-4 group-hover:text-blue-500 transition-colors flex-1 ${theme === 'light' ? 'text-black' : 'text-white'}`}>{a.title}</h3>
                                                <div className="flex items-center gap-2 text-[10px] font-black uppercase opacity-40 mt-4">
                                                    Read Article <Icon name="ArrowUpRight" size={12} />
                                                </div>
                                            </a>
                                        ))}
                                    </div>
                                </section>
                            </main>
                        </div>
                    ) : (
                        <div className="bg-[#1B4332] text-[#F8F9FA]">
                            <header className="fixed top-0 w-full z-50 p-8 text-2xl font-serif italic mix-blend-difference">Archive Viewer</header>
                            <main>
                                <section className="min-h-screen flex flex-col items-center justify-center p-12 bg-[#0A192F]">
                                    <h2 className="text-6xl font-black uppercase tracking-tighter italic text-white mb-12 text-center">Required Reading</h2>
                                    <div className="max-w-6xl w-full grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                                        {ARTICLES.map(a => (
                                            <a key={a.id} href={a.url} target="_blank" className="p-4 rounded-xl border border-white/20 hover:bg-white hover:text-black transition-all text-[10px] font-bold uppercase tracking-widest flex items-center justify-between">
                                                <span>{a.title}</span>
                                                <Icon name="ExternalLink" size={12} />
                                            </a>
                                        ))}
                                    </div>
                                </section>
                                {VIDEOS.map((v, i) => (
                                    <section key={v.id} className="min-h-screen flex items-center justify-center sticky top-0" style={{ backgroundColor: i % 2 === 0 ? '#1B4332' : '#D9480F' }}>
                                        <div className="max-w-6xl w-full px-12 grid lg:grid-cols-2 gap-16 items-center">
                                            <div className="order-2 lg:order-1">
                                                <h2 className="text-4xl sm:text-6xl font-serif italic mb-6 leading-tight">{v.title}</h2>
                                                <button onClick={() => setPlayingVideo(v)} className="px-8 py-4 rounded-full border border-white hover:bg-white hover:text-black transition-all font-bold uppercase text-xs tracking-widest">Watch Report</button>
                                            </div>
                                            <div className="order-1 lg:order-2 rounded-2xl shadow-3xl overflow-hidden aspect-video relative group cursor-pointer" onClick={() => setPlayingVideo(v)}>
                                                <img src={`https://img.youtube.com/vi/${v.youtubeId}/maxresdefault.jpg`} className="w-full h-full object-cover" />
                                                <div className="absolute inset-0 bg-black/30 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity"><Icon name="Play" size={64} /></div>
                                            </div>
                                        </div>
                                    </section>
                                ))}
                            </main>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
