<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>THE RECORD | Archive</title>
    <!-- React and ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX transformation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        
        body { font-family: 'Inter', sans-serif; transition: background-color 0.5s ease; }
        .custom-scrollbar::-webkit-scrollbar { width: 5px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #E63946; border-radius: 10px; }
        html { scroll-behavior: smooth; }
        
        .video-container { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; }
        .video-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border-radius: 1rem; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const apiKey = ""; // Gemini API Key

        // The 15 videos requested by the user
        const VIDEOS = [
            { id: 'v1', youtubeId: 'vK4y6C1Uuhw', title: 'Why the rate of single men in the US looking for dates has declined - CNN', thumbnail: 'https://youtu.be/vK4y6C1Uuhw?auto=format&fit=crop&q=80&w=800' },
            { id: 'v2', youtubeId: 'Tmo8geBTARk', title: '63% Of Men Under 30 Are Single - Courtney Ryan', thumbnail: 'https://youtu.be/Tmo8geBTARk?auto=format&fit=crop&q=80&w=800' },
            { id: 'v3', youtubeId: 'ilr1GpBzdeU', title: 'Why Aren't Men Getting Married Anymore? And Where Have the Manly Men Gone? - Suzanne Venker', thumbnail: 'https://youtu.be/ilr1GpBzdeU?auto=format&fit=crop&q=80&w=800' },
            { id: 'v4', youtubeId: 'nT9BX9iITz4', title: 'WARNING To Childless Women - Are You Happier or Miserable With That Decision? - Valuetainment', thumbnail: 'https://youtu.be/nT9BX9iITz4?auto=format&fit=crop&q=80&w=800' },
            { id: 'v5', youtubeId: 'yFgyEYZjT-U', title: 'Gen Z's Escapism Has Gone Too Far - Misha Petrov', thumbnail: 'https://youtu.be/yFgyEYZjT-U?auto=format&fit=crop&q=80&w=800' },
            { id: 'v6', youtubeId: 'aUy29XHSlkU', title: 'Tim Pool: 'High Quality Men' Should SHAME Arractive Women Into Not Being 'Instagram Hoes' - The Hill', thumbnail: 'https://youtu.be/aUy29XHSlkU?si=9O-3m8ButbhM89Ep?auto=format&fit=crop&q=80&w=800' },
            { id: 'v7', youtubeId: '5gIQ8Gyduog', title: 'Video Report 07', thumbnail: 'https://images.unsplash.com/photo-1480714378408-67cf0d13bc1b?auto=format&fit=crop&q=80&w=800' },
            { id: 'v8', youtubeId: 'uyrhmVSKwxE', title: 'REPLIKA - A CyberS*xual DISASTER - Upper Echelon', thumbnail: 'https://youtu.be/uyrhmVSKwxE?auto=format&fit=crop&q=80&w=800' },
            { id: 'v9', youtubeId: 'XGAMgPw3KlU', title: 'MAGA Girl DROPS TRUTH BOMBS About Western Women?! - whatever clips', thumbnail: 'https://youtu.be/XGAMgPw3KlU?auto=format&fit=crop&q=80&w=800' },
            { id: 'v10', youtubeId: 'nd_DVx5mQN4', title: 'Body Counts Are Rising, Marriage Rates Are Falling - The Comments Section', thumbnail: 'https://youtu.be/nd_DVx5mQN4?auto=format&fit=crop&q=80&w=800' },
            { id: 'v11', youtubeId: '9547hkXTGHw', title: 'Why Men Live Harder Lives Than Women - Valuetainment', thumbnail: 'https://youtu.be/9547hkXTGHw?auto=format&fit=crop&q=80&w=800' },
            { id: 'v12', youtubeId: 'W0TlYeCY8pM', title: ''IT'S COMING': Expert warns AI companions could harm human connection - Fox News', thumbnail: 'https://youtu.be/W0TlYeCY8pM?auto=format&fit=crop&q=80&w=800' },
            { id: 'v13', youtubeId: 'Q9kKu9Kglog', title: 'Hey Snapchat, This Is A BAD Move - The Comments Section', thumbnail: 'https://youtu.be/Q9kKu9Kglog?auto=format&fit=crop&q=80&w=800' },
            { id: 'v14', youtubeId: 'tk5KoWUwz6Q', title: 'The World Population Collapse No One's Talking About - Two Bit da Vinci', thumbnail: 'https://youtu.be/tk5KoWUwz6Q?si=uZdx84DM03YN0plN?auto=format&fit=crop&q=80&w=800' },
            { id: 'v15', youtubeId: 'beLEmk_FIEM', title: 'Let's Talk about Touch Starvation (Reddit Review) - HealthyGamerGG', thumbnail: 'https://youtu.be/beLEmk_FIEM?auto=format&fit=crop&q=80&w=800' }
        ];

        const Icon = ({ name, size = 20, className = "" }) => {
            const [svg, setSvg] = useState('');
            useEffect(() => {
                if (window.lucide && window.lucide.icons[name]) {
                    const iconDef = window.lucide.icons[name];
                    const content = iconDef.map(seg => {
                        const [tag, attrs] = seg;
                        const attrStr = Object.entries(attrs).map(([k, v]) => `${k}="${v}"`).join(' ');
                        return `<${tag} ${attrStr}></${tag}>`;
                    }).join('');
                    setSvg(`<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="${className}">${content}</svg>`);
                }
            }, [name, size, className]);
            return <span dangerouslySetInnerHTML={{ __html: svg }} className="inline-flex" />;
        };

        const fetchGemini = async (prompt) => {
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;
            const payload = { contents: [{ parts: [{ text: prompt }] }] };
            try {
                const response = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
                const data = await response.json();
                return data.candidates?.[0]?.content?.parts?.[0]?.text || "No response.";
            } catch (err) { return "Connection Error."; }
        };

        const USLiveClocks = () => {
            const [time, setTime] = useState(new Date());
            useEffect(() => {
                const timer = setInterval(() => setTime(new Date()), 1000);
                return () => clearInterval(timer);
            }, []);
            // Reversed order: HST to ET
            const zones = [
                { label: 'HST', zone: 'Pacific/Honolulu' }, { label: 'AKT', zone: 'America/Anchorage' },
                { label: 'PT', zone: 'America/Los_Angeles' }, { label: 'MT', zone: 'America/Denver' },
                { label: 'CT', zone: 'America/Chicago' }, { label: 'ET', zone: 'America/New_York' },
            ];
            return (
                <div className="bg-[#0A192F] text-white py-2 px-6 flex justify-center items-center flex-wrap gap-x-8 gap-y-1 text-[10px] font-black tracking-[0.2em] uppercase border-b border-white/10">
                    {zones.map(z => (
                        <div key={z.label} className="flex items-center gap-2">
                            <span className="opacity-50">{z.label}</span>
                            <span className="font-mono">{time.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true, timeZone: z.zone })}</span>
                        </div>
                    ))}
                </div>
            );
        };

        const VideoModal = ({ video, onClose }) => {
            if (!video) return null;
            return (
                <div className="fixed inset-0 z-[300] flex items-center justify-center p-0 sm:p-12">
                    <div className="absolute inset-0 bg-black/95 backdrop-blur-md" onClick={onClose} />
                    <div className="relative w-full max-w-6xl aspect-video bg-black shadow-2xl overflow-hidden sm:rounded-3xl border border-white/10">
                        <button onClick={onClose} className="absolute top-4 right-4 z-10 p-2 bg-black/50 text-white rounded-full hover:bg-white hover:text-black transition-all">
                            <Icon name="X" size={24} />
                        </button>
                        <iframe src={`https://www.youtube.com/embed/${video.youtubeId}?autoplay=1`} className="w-full h-full" allowFullScreen></iframe>
                    </div>
                </div>
            );
        };

        const AIAssistant = ({ theme }) => {
            const [isOpen, setIsOpen] = useState(false);
            const [query, setQuery] = useState('');
            const [messages, setMessages] = useState([{ role: 'ai', text: "Researcher active. Ready for analysis." }]);
            const [isTyping, setIsTyping] = useState(false);
            const handleAsk = async (e) => {
                e.preventDefault();
                if (!query.trim()) return;
                setMessages(prev => [...prev, { role: 'user', text: query }]);
                setQuery('');
                setIsTyping(true);
                const res = await fetchGemini(query);
                setMessages(prev => [...prev, { role: 'ai', text: res }]);
                setIsTyping(false);
            };
            return (
                <div className="fixed bottom-24 right-6 z-[110]">
                    {isOpen ? (
                        <div className={`w-80 sm:w-96 h-[500px] rounded-2xl shadow-2xl border flex flex-col overflow-hidden ${theme === 'light' ? 'bg-white' : 'bg-[#0F172A] border-gray-800'}`}>
                            <div className="bg-[#0A192F] p-4 text-white flex justify-between items-center">
                                <span className="font-bold text-sm uppercase tracking-wider flex items-center gap-2">Research Desk</span>
                                <button onClick={() => setIsOpen(false)}><Icon name="X" /></button>
                            </div>
                            <div className={`flex-1 overflow-y-auto p-4 space-y-4 custom-scrollbar ${theme === 'light' ? 'bg-gray-50' : 'bg-[#1E293B]'}`}>
                                {messages.map((m, i) => (
                                    <div key={i} className={`flex ${m.role === 'user' ? 'justify-end' : 'justify-start'}`}>
                                        <div className={`max-w-[85%] p-3 rounded-2xl text-sm ${m.role === 'user' ? 'bg-[#E63946] text-white' : theme === 'light' ? 'bg-white shadow-sm' : 'bg-[#0F172A] border border-gray-700 text-white'}`}>
                                            <p>{m.text}</p>
                                        </div>
                                    </div>
                                ))}
                            </div>
                            <form onSubmit={handleAsk} className={`p-4 border-t flex gap-2 ${theme === 'light' ? 'bg-white' : 'bg-[#0F172A]'}`}>
                                <input value={query} onChange={e => setQuery(e.target.value)} placeholder="Enter query..." className="flex-1 bg-gray-100 rounded-full px-4 py-2 text-sm text-black" />
                                <button type="submit" className="bg-[#0A192F] text-white p-2 rounded-full"><Icon name="Send" size={18} /></button>
                            </form>
                        </div>
                    ) : (
                        <button onClick={() => setIsOpen(true)} className="bg-[#0A192F] text-white p-4 rounded-full shadow-2xl flex items-center gap-3"><Icon name="Sparkles" /><span className="font-bold text-sm">Ask AI ✨</span></button>
                    )}
                </div>
            );
        };

        function App() {
            const [concept, setConcept] = useState('grid');
            const [theme, setTheme] = useState('light');
            const [playingVideo, setPlayingVideo] = useState(null);

            const gridClass = `min-h-screen transition-colors duration-500 ${theme === 'light' ? 'bg-white text-[#0A192F]' : 'bg-[#050b14] text-gray-100'}`;

            return (
                <div className="relative antialiased">
                    {/* Controls */}
                    <div className="fixed bottom-6 left-6 z-[200] flex gap-2 p-2 bg-white/90 dark:bg-[#0A192F]/90 backdrop-blur shadow-2xl rounded-2xl border border-white/10 items-center">
                        <button onClick={() => setConcept('grid')} className={`p-3 rounded-xl flex flex-col items-center gap-1 ${concept === 'grid' ? 'bg-red-600 text-white' : 'text-gray-400 hover:bg-gray-100'}`}><Icon name="LayoutGrid" /><span className="text-[8px] font-bold uppercase">Grid</span></button>
                        <button onClick={() => setConcept('list')} className={`p-3 rounded-xl flex flex-col items-center gap-1 ${concept === 'list' ? 'bg-blue-600 text-white' : 'text-gray-400 hover:bg-gray-100'}`}><Icon name="List" /><span className="text-[8px] font-bold uppercase">List</span></button>
                        <div className="w-px h-8 bg-gray-500/20 mx-2" />
                        <button onClick={() => setTheme(t => t === 'light' ? 'dark' : 'light')} className="p-3 bg-gray-100 rounded-xl">
                            {theme === 'light' ? <Icon name="Moon" className="text-[#0A192F]" /> : <Icon name="Sun" className="text-yellow-400" />}
                        </button>
                    </div>

                    <button onClick={() => window.scrollTo({top:0, behavior:'smooth'})} className="fixed bottom-[150px] right-6 p-4 bg-red-600 text-white rounded-full z-[105] shadow-xl"><Icon name="ChevronUp" size={24} /></button>

                    <VideoModal video={playingVideo} onClose={() => setPlayingVideo(null)} />
                    <AIAssistant theme={theme} />

                    {concept === 'grid' ? (
                        <div className={gridClass}>
                            <USLiveClocks />
                            <header className={`py-12 px-6 text-center border-b-4 ${theme === 'light' ? 'border-[#0A192F]' : 'border-red-600'}`}>
                                <h1 className="text-7xl font-black italic uppercase tracking-tighter">THE RECORD</h1>
                                <p className="text-xs font-bold uppercase tracking-[0.5em] opacity-40 mt-2">VIDEO ARCHIVE</p>
                            </header>
                            <main className="max-w-7xl mx-auto px-6 py-12">
                                <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-8">
                                    {VIDEOS.map(v => (
                                        <div key={v.id} className={`group border cursor-pointer rounded-xl overflow-hidden transition-all duration-500 ${theme === 'light' ? 'bg-white border-gray-100 shadow-sm' : 'bg-[#0F172A] border-gray-800'}`} onClick={() => setPlayingVideo(v)}>
                                            <div className="relative aspect-video overflow-hidden">
                                                <img src={v.thumbnail} className="w-full h-full object-cover group-hover:scale-110 transition-transform duration-700" />
                                                <div className="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center"><Icon name="Play" size={48} className="text-white" /></div>
                                            </div>
                                            <div className="p-5"><h3 className={`font-bold uppercase group-hover:text-red-500 transition-colors ${theme === 'light' ? 'text-black' : 'text-white'}`}>{v.title}</h3></div>
                                        </div>
                                    ))}
                                </div>
                            </main>
                        </div>
                    ) : (
                        <div className="bg-[#1B4332] text-[#F8F9FA]">
                            <header className="fixed top-0 w-full z-50 p-8 text-2xl font-serif italic mix-blend-difference">Archive List</header>
                            <main>
                                {VIDEOS.map((v, i) => (
                                    <section key={v.id} className="min-h-screen flex items-center justify-center sticky top-0" style={{ backgroundColor: i % 2 === 0 ? '#1B4332' : '#D9480F' }}>
                                        <div className="max-w-6xl w-full px-12 grid lg:grid-cols-2 gap-16 items-center">
                                            <div className="order-2 lg:order-1">
                                                <h2 className="text-6xl font-serif italic mb-6 leading-tight">{v.title}</h2>
                                                <button onClick={() => setPlayingVideo(v)} className="px-8 py-4 rounded-full border border-white hover:bg-white hover:text-black transition-all font-bold uppercase text-xs tracking-widest">Watch Now</button>
                                            </div>
                                            <div className="order-1 lg:order-2 rounded-2xl shadow-3xl overflow-hidden aspect-video relative group cursor-pointer" onClick={() => setPlayingVideo(v)}>
                                                <img src={v.thumbnail} className="w-full h-full object-cover" />
                                                <div className="absolute inset-0 bg-black/30 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity"><Icon name="Play" size={64} /></div>
                                            </div>
                                        </div>
                                    </section>
                                ))}
                            </main>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
